# STEM-C USK — Apache lokal
# Dipakai XAMPP di port 8080 supaya:
#   - aset CSS/JS/font dilayani Apache (bukan php artisan serve)
#   - PHP 8.4, bukan modul PHP 8.2 XAMPP
#   - htdocs / phpMyAdmin di :80 tetap utuh
#
# PHP dijalankan sebagai FastCGI persisten, bukan CGI per-request. Dengan CGI
# biasa satu halaman Laravel butuh ~900 ms karena proses PHP baru dibuat dan
# ~1.500 file dikompilasi ulang setiap request; dengan FastCGI + OPcache turun
# ke ~170 ms. Listener dijalankan oleh apache/start-php-fcgi.ps1 karena Apache
# XAMPP di mesin ini tidak punya mod_fcgid untuk mengurus prosesnya sendiri.
#
# Diikutsertakan dari C:/xampp/apache/conf/extra/httpd-vhosts.conf

Listen 127.0.0.1:8080

# mod_proxy sudah aktif di httpd.conf; mod_proxy_fcgi dimuat di sini agar
# httpd.conf XAMPP tidak perlu disentuh.
<IfModule !proxy_fcgi_module>
    LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
</IfModule>

<VirtualHost 127.0.0.1:8080>
    ServerName stemc.local
    DocumentRoot "D:/USK/STEM/stemc-web/public"
    DirectoryIndex index.php index.html

    <Directory "D:/USK/STEM/stemc-web/public">
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    # Timpa handler PHP 8.2 XAMPP untuk vhost ini saja. Garis miring penutup
    # pada URL wajib: tanpa itu Apache merangkai "…:9101" + "D:/…" menjadi URI
    # tak sah (AH00898). Penjaga -f mencegah URL palsu seperti /foto.php/x.jpg
    # ikut dieksekusi.
    <FilesMatch "\.php$">
        <If "-f %{REQUEST_FILENAME}">
            SetHandler "proxy:fcgi://127.0.0.1:9101/"
        </If>
    </FilesMatch>

    # Jalur proxy selalu diawali "/", sehingga di Windows SCRIPT_FILENAME jadi
    # "/D:/…" dan PHP menjawab "File not found". ".*" sengaja rakus supaya yang
    # diambil adalah kemunculan huruf drive paling akhir.
    ProxyFCGISetEnvIf "reqenv('SCRIPT_FILENAME') =~ m|^.*([a-zA-Z]:/.*)$|" SCRIPT_FILENAME "$1"

    # Catatan: satu proses php-cgi.exe Windows melayani satu request sekaligus,
    # jadi request PHP berbarengan akan mengantre. Upaya memakai
    # balancer:// dengan empat listener sudah dicoba dan ditinggalkan — Apache
    # memang menyebar ke keempat worker, tetapi PHP menjawab 404 karena
    # SCRIPT_FILENAME hasil rakitan balancer tidak bisa diperbaiki dari sini.
    # Untuk satu pengembang, antrean itu tidak terasa (~170 ms per halaman).

    ErrorLog "D:/USK/STEM/stemc-web/storage/logs/apache-error.log"
    CustomLog "D:/USK/STEM/stemc-web/storage/logs/apache-access.log" common

    # Kompresi teks bila modul tersedia (LoadModule di httpd.conf XAMPP).
    <IfModule deflate_module>
        <IfModule filter_module>
            AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml image/svg+xml
        </IfModule>
    </IfModule>
</VirtualHost>
